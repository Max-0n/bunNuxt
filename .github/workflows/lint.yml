name: Lint

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    name: Lint ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: frontend
            path: frontend
          - name: backend
            path: backend
          - name: cdn
            path: cdn
          - name: protocol
            path: protocol
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

