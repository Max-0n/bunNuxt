server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    root /var/www/html;
    index index.html;

    # Отключение кеширования для HTML файлов
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статических ресурсов на 2 недели
    location ~* \.(svg|png|jpg|jpeg|js|css)$ {
        expires 14d;
        add_header Cache-Control "public, max-age=1209600";
    }

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд
    # Обрабатываем /api (без слеша) - редирект на /api/
    location = /api {
        return 301 /api/;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:7078/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}